name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    # Shared pipeline from truvity/ci-workflows (public, MIT). It runs
    # goreleaser under devbox, then packages and pushes charts with
    # helmctl (truvity/ocictl) rather than `helm package` + `helm push`:
    # helmctl injects the git tag as the chart version and strips the
    # `created` annotation, so identical content yields an identical
    # digest and immutable chart tags stay trustworthy across re-releases.
    #
    # No `secrets: inherit`: the whole pipeline runs on this repo's own
    # GITHUB_TOKEN, which is why calling it from a different org works.
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@58d470dff71c732e208f47a80bb6c5d741e016a7 # v3.25.0
    with:
      charts: '["netbox-mcp-upstream"]'
      chart-registry: oci://ghcr.io/excavador/charts
      # This chart packages someone else's application, so the release
      # version says nothing about the image. Left on the default the
      # tooling stamps the git tag as appVersion, and a chart resolving
      # its image from appVersion then points at an upstream tag that was
      # never published (INF-617). `chart` keeps what Chart.yaml declares.
      chart-app-version: chart
