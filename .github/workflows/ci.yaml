name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same devbox environment CI and humans use, so `just check` locally
      # and `just check` here run byte-identical tool versions.
      - uses: truvity/ci-workflows/.github/actions/setup-devbox@49248a6cebd3720ac7f2eaf2e98ec97c0967b3b6 # v2.17.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: devbox run -- just check
