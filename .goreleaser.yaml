# Chart-only repository: there is no Go binary and no container image to
# build here — the image belongs to upstream netbox-mcp-server.
# goreleaser's job is the GitHub release and its changelog; chart
# packaging and the push to ghcr.io/excavador/charts happen in the release
# workflow.
version: 2

project_name: netbox-mcp-chart

builds:
  - skip: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto
  footer: |
    Helm chart: `oci://ghcr.io/excavador/charts/netbox-mcp-upstream:{{ .Version }}`
